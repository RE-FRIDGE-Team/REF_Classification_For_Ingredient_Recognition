# ═══════════════════════════════════════════════════════════════════
# RE:FRIDGE Phase 1 — 3-Model 병렬 실험 설정
# 모든 값은 이 파일에서만 정의. 소스코드 하드코딩 금지.
# ═══════════════════════════════════════════════════════════════════

# ─── 데이터 ─────────────────────────────────────────────────────────
data:
  # 입력 컬럼 매핑 (CSV/XLSX 실제 컬럼명 → 내부 키)
  input_columns:
    product_name:    "product_name"
    large_category:  "category_large"
    medium_category: "category_medium"
    category_tag:    "item_type"
    brand_name:      "brand_name"

  # 학습에서 제외할 카테고리 값
  exclude_large: ["기타"]
  exclude_tag:   ["UNKNOWN"]
  # 브랜드 사전 경로 (product_name_parser 용)
  brand_dict_path: "product_data_collection/not_grocery_and_brand_list/grocery_brand_name.json"

# ─── 전처리 ─────────────────────────────────────────────────────────
preprocessing:
  use_parser: true                     # REFProductNameParser 사용 여부
  morpheme_analyzer: "Okt"            # Okt | Mecab | Komoran
  stopwords:
    - "기획"
    - "특가"
    - "증정"
    - "박스"
    - "세트"
    - "국내산"
    - "행사"
    - "무료"
    - "배송"
    - "냉동"
    - "냉장"
    - "상온"
    - "당일"
    - "특선"
  alcohol_brand_preserve: true         # 술 카테고리: 브랜드명 복구

# ─── 교차검증 ────────────────────────────────────────────────────────
cv:
  n_splits:  5
  group_col: "brand_name"             # GroupKFold 그룹 키
  seed:      42

# ─── Optuna HPO ─────────────────────────────────────────────────────
optuna:
  objective:       "large_macro_f1"   # 대분류 macro F1 최대화 (합격기준: ≥0.85)
  n_trials:
    tfidf_lgbm:   100
    fasttext:      80
    koelectra:     30
  sampler:         "TPE"              # TPE | Random | CmaEs
  pruner:          "MedianPruner"     # MedianPruner | NopPruner
  n_startup_trials: 10               # 초기 Random 탐색 수
  n_warmup_steps:   2               # Pruner warm-up fold 수
  timeout_per_model: 60            # 모델당 최대 탐색 시간 (초)
  storage:         "sqlite:///results/optuna.db"   # 중단 후 재개 지원

# ─── 모델별 HPO 탐색 공간 ─────────────────────────────────────────────

# TF-IDF + LightGBM
tfidf_lgbm:
  tfidf:
    ngram_range:    [[1,1], [1,2], [1,3]]  # categorical
    max_features:   [3000, 20000]           # int (log scale)
    min_df:         [1, 5]                  # int
    sublinear_tf:   [true, false]           # categorical
  lgbm:
    n_estimators:      [100, 1000]          # int (log scale)
    num_leaves:        [15, 255]            # int (log scale)
    max_depth:         [-1, 12]             # int
    learning_rate:     [0.005, 0.3]         # float (log scale)
    min_child_samples: [5, 100]             # int (log scale)
    colsample_bytree:  [0.5, 1.0]          # float
    subsample:         [0.5, 1.0]          # float
    reg_alpha:         [1.0e-4, 10.0]      # float (log scale)
    reg_lambda:        [1.0e-4, 10.0]      # float (log scale)

# FastText + KoNLPy + ML
fasttext_konlpy:
  fasttext:
    vector_size: [50, 300]      # int
    window:      [2, 7]         # int
    min_count:   [1, 5]         # int
    epochs:      [5, 50]        # int
    sg:          [0, 1]         # int: 0=CBOW, 1=SkipGram
    negative:    [5, 20]        # int
  classifier:
    type: ["logreg", "lgbm"]    # categorical
    logreg:
      C:        [0.01, 100.0]   # float (log scale)
      max_iter: [200, 1000]     # int
    lgbm:                       # tfidf_lgbm.lgbm과 동일 공간 적용

# KoELECTRA Multi-task
koelectra:
  backbone:  "monologg/koelectra-base-v3-discriminator"   # 고정
  training:
    learning_rate: [5.0e-6, 5.0e-4]    # float (log scale)
    batch_size:    [8, 16, 32]          # categorical
    epochs:        [3, 15]              # int
    max_length:    [32, 64, 128]        # categorical
    dropout:       [0.0, 0.3]           # float
    freeze_layers: [0, 9]               # int (0=전체 파인튜닝)
    warmup_ratio:  [0.0, 0.2]          # float
    weight_decay:  [0.0, 0.1]          # float
  loss_weights:
    large:  [0.2, 0.6]                 # float (sum≈1 soft constraint)
    medium: [0.2, 0.6]
    tag:    [0.1, 0.4]

# ─── 출력 ────────────────────────────────────────────────────────────
output:
  dir:              "results/"
  save_predictions: true
  save_best_model:  true
  html_report:      true
  chart_dpi:        150

# ─── 합격 기준 ───────────────────────────────────────────────────────
gate:
  large_f1_min: 0.85                   # Phase 1 합격 기준

# ─── 로깅 ────────────────────────────────────────────────────────────
logging:
  level:    "INFO"
  log_file: "logs/experiment.log"
