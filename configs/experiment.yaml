# ═══════════════════════════════════════════════════════════════════
# RE:FRIDGE Phase 1 — 실험 설정 (2026-07 개편)
# 모든 값은 이 파일에서만 정의. 소스코드 하드코딩 금지.
#
# 개편 요지:
#   - fasttext_konlpy 공간 삭제 (모델 삭제)
#   - tfidf_lgbm → text_pipeline 으로 개명. 탐색공간에 ★모델 종류·C·
#     class_weight·word n-gram·head-noun 가중이 추가됨.
#   - 전처리 토글(preprocessing.*)은 HPO 대상이 아니라 CLI A/B 실험 축.
#     (전처리는 fold 생성 이전에 일어나므로 Optuna 안에서 바꾸면 안 됨)
# ═══════════════════════════════════════════════════════════════════

# ─── 데이터 ─────────────────────────────────────────────────────────
data:
  input_columns:
    product_name:    "product_name"
    large_category:  "category_large"
    medium_category: "category_medium"
    category_tag:    "item_type"
    brand_name:      "brand_name"
  # PGIN 컬럼 — Mecab 사용자사전 자동 구축용 (없으면 무시)
  pgin_column: "processed_grocery_item_name"
  exclude_large: ["기타"]
  exclude_tag:   ["UNKNOWN"]
  brand_dict_path: "product_data_collection/not_grocery_and_brand_list/grocery_brand_name.json"

# ─── 전처리 (CLI 인수로 개별 override 가능 — A/B 실험 축) ───────────
preprocessing:
  use_parser: true
  morpheme_analyzer: "mecab"          # mecab(신규 기본) | okt | none
  remove_brand: true                  # false → 브랜드 원문 유지 실험
  remove_volume: true
  remove_quantity: true
  placeholder: false                  # true → 제거 대신 BRANDTOK/VOLTOK/QTYTOK 치환
  alcohol_brand_preserve: true
  dedup: true                         # refined_text 근접중복 원본 행 제거
  stopwords:
    - "기획"
    - "특가"
    - "증정"
    - "박스"
    - "세트"
    - "국내산"
    - "행사"
    - "무료"
    - "배송"
    - "냉동"
    - "냉장"
    - "상온"
    - "당일"
    - "특선"

# ─── 피처 토글 (CLI override 가능 — A/B 실험 축) ────────────────────
features:
  use_char: true
  use_word: true                      # ★char + word FeatureUnion
  use_head_noun: true                 # ★head-noun 별도 필드 + 가중
  use_alcohol_lexicon: true           # ★술 스타일어 카운트 피처
  use_rules: true                     # ★모호 헤드어 룰 오버라이드
  vectorizer: "tfidf"                 # tfidf | bm25

# ─── 교차검증 ────────────────────────────────────────────────────────
# 판정 기준은 반드시 StratifiedGroupKFold(group=brand).
# StratifiedKFold 는 브랜드 누수로 낙관적(0.87 vs 0.83) → 진단용으로만.
cv:
  n_splits:  5
  group_col: "brand_name"
  seed:      42
  strategy:  "StratifiedGroupKFold"

# ─── Optuna HPO ─────────────────────────────────────────────────────
optuna:
  objective:       "large_macro_f1"
  n_trials:
    text_pipeline: 100
    koelectra:      30
  sampler:         "TPE"
  pruner:          "MedianPruner"
  n_startup_trials: 10
  n_warmup_steps:   2
  timeout_per_model: 3600
  storage:         "sqlite:///results/optuna.db"

# ─── text_pipeline HPO 탐색 공간 ─────────────────────────────────────
text_pipeline:
  feature:
    char_ngram_range:  [[2, 4], [2, 5], [3, 5]]   # char n-gram 후보 (인덱스 선택)
    max_features:      [5000, 30000]              # int (log)
    min_df:            [1, 5]
    sublinear_tf:      [true, false]
    word_ngram_range:  [[1, 1], [1, 2]]           # ★word n-gram 후보
    word_max_features: [3000, 15000]              # int (log)
    head_weight:       [1.0, 3.0]                 # ★head-noun 가중 (2.0 근방 탐색)
  clf:
    # ★헤드(대분류/중분류)별 베스트 모델을 Optuna 가 선택
    model_type:   ["lgbm", "linearsvc", "logreg", "cnb", "ensemble"]
    C:            [0.01, 100.0]                   # 선형 계열 전용 (조건부 샘플링)
    class_weight: ["balanced", null]              # macro_F1 → balanced 기본 우세 예상
  lgbm:                                           # lgbm/ensemble 선택 trial 만 샘플링
    n_estimators:      [100, 1000]
    num_leaves:        [15, 255]
    max_depth:         [-1, 12]
    learning_rate:     [0.005, 0.3]
    min_child_samples: [5, 100]
    colsample_bytree:  [0.5, 1.0]
    subsample:         [0.5, 1.0]
    reg_alpha:         [1.0e-4, 10.0]
    reg_lambda:        [1.0e-4, 10.0]

# ─── KoELECTRA (후순위 옵션 — 술 OOV 고유명사 구제 전용) ─────────────
koelectra:
  backbone:  "monologg/koelectra-base-v3-discriminator"
  training:
    learning_rate: [5.0e-6, 5.0e-4]
    batch_size:    [8, 16, 32]
    epochs:        [3, 15]
    max_length:    [32, 64, 128]
    dropout:       [0.0, 0.3]
    freeze_layers: [0, 9]
    warmup_ratio:  [0.0, 0.2]
    weight_decay:  [0.0, 0.1]
  loss_weights:
    large:  [0.2, 0.6]
    medium: [0.2, 0.6]
    tag:    [0.1, 0.4]

# ─── 출력 ────────────────────────────────────────────────────────────
output:
  dir:              "results/"
  save_predictions: true
  save_best_model:  true
  html_report:      true
  chart_dpi:        150

# ─── 합격 기준 ───────────────────────────────────────────────────────
gate:
  large_f1_min: 0.90       # 목표 상향: 대분류 StratifiedGroupKFold macro_F1 ≥ 0.90

# ─── 로깅 ────────────────────────────────────────────────────────────
logging:
  level:    "INFO"
  log_file: "logs/experiment.log"
